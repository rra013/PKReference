# The backend's tests (mvn verify: unit tests and an embedded-Kafka pipeline test). The app
# has no CI; its tests run on a Mac with the simulator.
name: Backend

on:
  push:
    branches: [main, backend-integration]
    paths:
      - "backend/**"
      - "champions-*.json"
      - "PKReference/showdown-champions-data.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "champions-*.json"
      - "PKReference/showdown-champions-data.json"
      - ".github/workflows/backend.yml"

# The job only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
