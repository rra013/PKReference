# Local single-node Kafka (KRaft, no Zookeeper), Kafka UI, and Postgres for the counters.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: pkref-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Keep the topics (standings.fetched holds every event fetched) across restarts and
      # `docker compose down`: without these the broker wrote to /tmp inside the container.
      # The cluster ID has to stay the same for the stored data to load.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ARrv7jH-RueeM_hdf9TgjA
    volumes:
      - pkref-kafka:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pkref-kafka-ui
    depends_on: [kafka]
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  postgres:
    image: postgres:17-alpine
    container_name: pkref-postgres
    ports:
      - "5432:5432"
    environment:
      # Local development only.
      POSTGRES_DB: pkref
      POSTGRES_USER: pkref
      POSTGRES_PASSWORD: pkref
    volumes:
      - pkref-postgres:/var/lib/postgresql/data

volumes:
  pkref-kafka:
  pkref-postgres:
