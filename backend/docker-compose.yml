# Local single-node Kafka (KRaft, no Zookeeper), Kafka UI, and Postgres for the counters.
# Each port is published on 127.0.0.1 only: Kafka UI has no login, and Kafka and Postgres take
# anyone who reaches them. Only the API is reached from other devices, through Tailscale (README).
#
#   docker compose up -d        start them        docker compose down      stop them (data is kept)
#
# The server itself isn't here: in development it runs on the host (mvn spring-boot:run) and
# reaches these through the published ports. docker-compose.server.yml adds it as a container.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: pkref-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # KRaft mode: this one node is both the broker (stores the topics' records) and the
      # controller (keeps the cluster's metadata), which older Kafka needed ZooKeeper for.
      KAFKA_PROCESS_ROLES: broker,controller
      # Three listeners, because "where is the broker?" has a different answer for each caller.
      # A client connects to a bootstrap address, and the broker replies with the address to use
      # from then on (the "advertised" one), which must be reachable from where that client is:
      #   EXTERNAL   for the server and tools on this machine  -> localhost:9092
      #   INTERNAL   for other containers (Kafka UI, the API)  -> kafka:19092
      #   CONTROLLER for the controller's own traffic; never advertised to clients.
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Keep the topics (standings.fetched holds every event fetched) across restarts and
      # `docker compose down`: without these the broker wrote to /tmp inside the container.
      # The cluster ID has to stay the same for the stored data to load.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ARrv7jH-RueeM_hdf9TgjA
    volumes:
      - pkref-kafka:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pkref-kafka-ui
    depends_on: [kafka]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # The database. Flyway creates the tables when the server first connects.
  postgres:
    image: postgres:17-alpine
    container_name: pkref-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Local development only.
      POSTGRES_DB: pkref
      POSTGRES_USER: pkref
      POSTGRES_PASSWORD: pkref
    volumes:
      - pkref-postgres:/var/lib/postgresql/data

# Named volumes outlive their containers: `docker compose down` keeps them, and only
# `docker compose down -v` deletes the data.
volumes:
  pkref-kafka:
  pkref-postgres:
