# The server's settings. Spring Boot reads this file at start-up and configures itself from it:
# everything under `spring:` sets up a library (the database, Kafka), and everything under
# `pkref:` is this project's own, bound into the records LimitlessProperties, SmogonProperties
# and ApiAuthProperties.
#
# ${NAME:default} takes the environment variable NAME when it's set and the default otherwise,
# so a deployment changes a setting without a rebuild (docker-compose.server.yml sets several).
spring:
  application:
    name: pkreference-backend
  # Postgres from docker-compose.yml. Flyway owns the schema (src/main/resources/db/migration);
  # Hibernate only checks the entities against it.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pkref}
    username: ${DATABASE_USER:pkref}
    password: ${DATABASE_PASSWORD:pkref}
  jpa:
    hibernate:
      # Hibernate never creates or alters tables: at start-up it only checks that the two @Entity
      # classes match what Flyway made, and fails loudly if they don't.
      ddl-auto: validate
    # Don't hold a database connection open for the whole of each web request: a transaction
    # lasts only as long as the @Transactional method that needs it.
    open-in-view: false
  task:
    scheduling:
      # Two pollers, Limitless's and Smogon's: one waiting on its requests doesn't hold up the other.
      pool:
        size: 2
  kafka:
    # Where the broker is: the first address a client connects to, to learn about the cluster.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Topics.java's settings (retention, sizes) reach topics that already exist.
      modify-topic-configs: true
    # The producer: what KafkaTemplate.send uses.
    producer:
      # A send counts as done only when the broker has it safely stored (all in-sync replicas;
      # with one broker, that one). The slowest setting, and the one that doesn't lose records.
      acks: all
      # Standings are about 1.2 KB of JSON a player; compressed, a big event stays well
      # under the topic's limit.
      compression-type: zstd
      # Kafka stores bytes. Keys go in as plain text; values as JSON, with a header naming the
      # Java type so the consumer knows which record class to rebuild.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # If a send is retried after a network hiccup, the broker recognizes the repeat and keeps
        # one copy, in order.
        enable.idempotence: true
        max.request.size: 5242880        # full decklists for large events
    # The consumers: what every @KafkaListener uses, each with its own groupId.
    consumer:
      # A consumer group that has never read a topic starts from its first record, not from "now":
      # a new listener, or a group whose offsets were reset, sees everything the topic holds.
      auto-offset-reset: earliest
      # The standings fetcher waits its turn under Limitless's limit, up to 5 minutes a request.
      # A consumer that goes longer than max.poll.interval.ms between polls is dropped and its
      # records sent again (fetched again, spending the limit), so take few at a time and allow
      # long gaps.
      max-poll-records: 10
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        max.poll.interval.ms: 900000   # 15 minutes
        # The JSON deserializer builds the class a record's type header names, and only if that
        # class is in this package: a record can't ask the server to instantiate anything else.
        spring.json.trusted.packages: com.pkreference.backend.model
        max.partition.fetch.bytes: 5242880
        fetch.max.bytes: 52428800

pkref:
  limitless:
    game: ${LIMITLESS_GAME:VGC}      # check GET /games for the right id
    # Comma-separated Limitless format ids ("M-C,M-B"); empty lists every format of the game.
    # LIMITLESS_FORMAT, the old single format, still works.
    formats: ${LIMITLESS_FORMATS:${LIMITLESS_FORMAT:}}
    ingest-enabled: true
    poll-interval: 30m
    # How far back each poll walks the list. Set it longer once (say 120d) to backfill; at
    # three requests an event, a backfill takes hours under the throttle.
    lookback: ${LIMITLESS_LOOKBACK:7d}
    max-pages: 40
    # The app's rules (TeamCorpusConfiguration): events of 16 or more, final 48 hours after they
    # start, fetched again every 6 hours until then.
    min-players: 16
    settle-after: 48h
    refetch-after: 6h
    pending-timeout: 24h
    # Limitless allows 50 requests in 5 minutes without a key. Leave room for the app,
    # which shares the address when it runs on the same machine.
    requests-per-window: 40
    window: 5m
  # Smogon's monthly ladder stats (README, "The ladder").
  smogon:
    ingest-enabled: ${SMOGON_INGEST_ENABLED:true}
    # A month's stats appear on the 1st of the next, and don't change.
    poll-interval: 12h
    # How many of the newest months each poll looks at. Set it higher once to backfill: a month
    # is about 24 files and 50 MB, each fetched once.
    lookback-months: ${SMOGON_LOOKBACK_MONTHS:2}
    # Smogon's rating cutoffs: 0 is every player.
    ratings: 0,1500,1630,1760
    # Smogon's files are a courtesy, not an API: one request at a time, this far apart.
    request-gap: 2s
  # Signing in (README, "Signing in to the API").
  api:
    # API keys, as SHA-256 hashes (backend/scripts/new-api-key.sh), comma-separated. None, and every
    # request is let in, as on a server only this machine can reach.
    key-hashes: ${PKREF_API_KEY_HASHES:}
    # How long an access token, which a key is traded for, is good for.
    token-lifetime: ${PKREF_TOKEN_LIFETIME:15m}
    # What signs the tokens, 32 characters or more. Empty: a random one each start, so a restart ends
    # the tokens from before it and clients trade their keys again.
    token-secret: ${PKREF_TOKEN_SECRET:}

# Listen on this machine only. Other devices reach the API through Tailscale (README), which
# forwards to 127.0.0.1:8080. SERVER_ADDRESS=0.0.0.0 opens it to every network the machine is on.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  # The /v1 responses are JSON lists; gzip them.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB
